# Supabase local development config
# Run: supabase start (requires Supabase CLI)

project_id = "perakita"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["perakita://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your PeraKita account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your PeraKita password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your PeraKita sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "You're invited to PeraKita"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new PeraKita email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "{{ .Token }} is your PeraKita verification code"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your PeraKita password was changed"
content_path = "./supabase/templates/password_changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your PeraKita email was changed"
content_path = "./supabase/templates/email_changed.html"

[auth.email.notification.phone_changed]
enabled = true
subject = "Your PeraKita phone number was changed"
content_path = "./supabase/templates/phone_changed.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "A verification method was added to PeraKita"
content_path = "./supabase/templates/mfa_enrolled.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "A verification method was removed from PeraKita"
content_path = "./supabase/templates/mfa_unenrolled.html"

[auth.email.notification.identity_linked]
enabled = true
subject = "A sign-in method was linked to PeraKita"
content_path = "./supabase/templates/identity_linked.html"

[auth.email.notification.identity_unlinked]
enabled = true
subject = "A sign-in method was removed from PeraKita"
content_path = "./supabase/templates/identity_unlinked.html"
